<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人任务管理系统</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>个人任务管理系统</h1>
      <p class="subtitle">直接可用的成品页面：新增任务、筛选、完成、删除。</p>

      <section class="card">
        <h2>新建任务</h2>
        <form id="task-form">
          <input name="title" placeholder="任务标题" required maxlength="120" />
          <input name="category" placeholder="分类（如：工作）" maxlength="50" />
          <textarea name="description" placeholder="任务描述" maxlength="1000"></textarea>
          <div class="row">
            <input name="due_date" type="date" />
            <select name="priority">
              <option value="low">低</option>
              <option value="medium" selected>中</option>
              <option value="high">高</option>
            </select>
            <select name="status">
              <option value="todo" selected>待办</option>
              <option value="doing">进行中</option>
              <option value="done">已完成</option>
              <option value="archived">已归档</option>
            </select>
          </div>
          <button type="submit">新增任务</button>
        </form>
      </section>

      <section class="card">
        <h2>任务列表</h2>
        <div class="row">
          <select id="filter-status">
            <option value="">全部状态</option>
            <option value="todo">待办</option>
            <option value="doing">进行中</option>
            <option value="done">已完成</option>
            <option value="archived">已归档</option>
          </select>
          <select id="filter-priority">
            <option value="">全部优先级</option>
            <option value="low">低</option>
            <option value="medium">中</option>
            <option value="high">高</option>
          </select>
          <label><input id="filter-due-today" type="checkbox" /> 今天到期</label>
          <button id="refresh-btn" type="button">刷新</button>
        </div>
        <ul id="task-list"></ul>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
